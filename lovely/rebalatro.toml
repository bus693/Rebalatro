# blue stake transition visuals
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "	G:draw()"
position = "after"
payload = '''
	G.C.ANTE_COUNTER_TEXT = G.C.ANTE_COUNTER_TEXT or {1, 1, 1, 1}
	G.C.ANTE_COUNTER_NUM = G.C.ANTE_COUNTER_NUM or {1, 1, 1, 1}
	if G.GAME and G.GAME.round_resets and G.GAME.round_resets.ante then
		local p = math.max(0, math.min((G.GAME.round_resets.ante - 1) / 4, 1))
		G.C.ANTE_COUNTER_TEXT[1] = G.C.WHITE[1] * (1-p) + G.C.RED[1] * p
		G.C.ANTE_COUNTER_TEXT[2] = G.C.WHITE[2] * (1-p) + G.C.RED[2] * p
		G.C.ANTE_COUNTER_TEXT[3] = G.C.WHITE[3] * (1-p) + G.C.RED[3] * p
		G.C.ANTE_COUNTER_NUM[1] = G.C.IMPORTANT[1] * (1-p) + G.C.RED[1] * p
		G.C.ANTE_COUNTER_NUM[2] = G.C.IMPORTANT[2] * (1-p) + G.C.RED[2] * p
		G.C.ANTE_COUNTER_NUM[3] = G.C.IMPORTANT[3] * (1-p) + G.C.RED[3] * p
	end

	if G.GAME and G.GAME.blue_stake_vignette and G.GAME.blue_stake_vignette > 0 then
		if not G.blue_stake_vignette_shader then
			G.blue_stake_vignette_shader = love.graphics.newShader[[
				extern number alpha;
				vec4 effect( vec4 colour, Image texture, vec2 texture_coords, vec2 screen_coords )
				{
					vec2 uv = screen_coords.xy / love_ScreenSize.xy;
					uv *=  1.0 - uv.yx;
					float vig = uv.x*uv.y * 10.0;
					vig = pow(vig, 0.35);
					return vec4(0.0, 0.0, 0.0, (1.0 - vig) * alpha * 1.5);
				}
			]]
		end
		love.graphics.setShader(G.blue_stake_vignette_shader)
		G.blue_stake_vignette_shader:send("alpha", G.GAME.blue_stake_vignette)
		love.graphics.setColor(1, 1, 1, 1)
		love.graphics.rectangle('fill', 0, 0, love.graphics.getWidth(), love.graphics.getHeight())
		love.graphics.setShader()
	end
'''
match_indent = true


